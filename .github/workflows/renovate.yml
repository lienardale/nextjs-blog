name: Renovate

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Run Renovate
        uses: renovatebot/github-action@v32.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
